services:
  app:
    build: .
    image: crud:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      GIN_MODE: release
    expose:
      - "8000"            # internal only; Caddy is the public entrypoint
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Caddy terminates TLS (auto Let's Encrypt) and proxies to the app.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # One-off migration runner. Not started by `up`; invoke explicitly:
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
  migrate:
    build: .
    image: crud:latest
    entrypoint: ["/app/migrate"]
    env_file: .env.prod
    restart: "no"
    profiles: ["tools"]

volumes:
  caddy_data:
  caddy_config:
